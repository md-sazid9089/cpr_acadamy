<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CPR Medical Academy — FCPS, BCS and MBBS postgraduate exam preparation courses for doctors in Bangladesh."
    />
    <title>CPR Medical Academy</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%2312854f'/%3E%3Cpath d='M3 12h3l2-5 3 10 3-7 1.5 2H21' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <script>
      // Apply the stored theme before first paint so dark mode never flashes white.
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem('cpr-theme') || 'null');
          var mode = stored && stored.state && stored.state.theme;
          if (!mode || mode === 'system') {
            mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.classList.toggle('dark', mode === 'dark');
        } catch (e) {
          /* no-op */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
